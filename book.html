<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book List Flipbook</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --book: #d8a38d;
    --book-dark: #b97e68;
    --paper: #fffaf2;
    --ink: #5b4a45;
    --accent: #8d6f65;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f7f1ec;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    overflow: hidden;
  }

  .widget {
    width: min(92vw, 720px);
    text-align: center;
  }

  .book-stage {
    position: relative;
    width: min(86vw, 650px);
    height: min(70vw, 430px);
    margin: auto;
    perspective: 1600px;
  }

  /* ---------- COVER ---------- */

  .cover {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 52%;
    height: 88%;
    border-radius: 5px 10px 10px 5px;
    background:
      linear-gradient(90deg, rgba(0,0,0,.10), transparent 10%),
      var(--book);
    box-shadow:
      12px 14px 25px rgba(77,55,48,.20),
      inset 4px 0 0 rgba(255,255,255,.12);
    transform-origin: left center;
    transition: transform .9s cubic-bezier(.2,.75,.2,1), opacity .45s;
    z-index: 20;
    cursor: pointer;
  }

  .cover::after {
    content: "";
    position: absolute;
    right: -9px;
    top: 3%;
    width: 10px;
    height: 94%;
    border-radius: 0 5px 5px 0;
    background: repeating-linear-gradient(
      to bottom,
      #ead4c5 0 3px,
      #d5b4a2 3px 5px
    );
    opacity: .85;
  }

  .cover-inner {
    position: absolute;
    inset: 7%;
    border: 1px solid rgba(91,74,69,.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .cover-title {
    font-size: clamp(24px, 5vw, 42px);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .cover-subtitle {
    font-size: clamp(13px, 2vw, 17px);
    font-style: italic;
  }

  .cover-decoration {
    margin: 15px 0;
    font-size: 30px;
  }

  .cover.open {
    transform: rotateY(-165deg);
    opacity: 0;
    pointer-events: none;
  }

  /* ---------- OPEN BOOK ---------- */

  .open-book {
    position: absolute;
    inset: 0;
    display: flex;
    opacity: 0;
    transform: scale(.96);
    transition: opacity .65s .2s, transform .65s .2s;
    pointer-events: none;
  }

  .open-book.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  .page {
    position: relative;
    width: 50%;
    height: 88%;
    top: 6%;
    background:
      linear-gradient(rgba(255,255,255,.25), rgba(255,255,255,.25)),
      var(--paper);
    box-shadow: 0 13px 25px rgba(77,55,48,.18);
    overflow: hidden;
  }

  .page.left {
    border-radius: 10px 2px 2px 10px;
    transform-origin: right center;
    background:
      linear-gradient(90deg, #fffaf2 92%, #eadfd4 100%);
  }

  .page.right {
    border-radius: 2px 10px 10px 2px;
    background:
      linear-gradient(270deg, #fffaf2 92%, #eadfd4 100%);
  }

  .page::before {
    content: "";
    position: absolute;
    inset: 5%;
    border: 1px solid rgba(91,74,69,.10);
    pointer-events: none;
  }

  .spine {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 6%;
    height: 88%;
    width: 5px;
    transform: translateX(-50%);
    background: linear-gradient(
      90deg,
      rgba(0,0,0,.12),
      rgba(255,255,255,.5),
      rgba(0,0,0,.08)
    );
  }

  .page-image {
    position: absolute;
    inset: 10%;
    width: 80%;
    height: 80%;
    object-fit: cover;
    border-radius: 3px;
    box-shadow: 0 4px 12px rgba(60,45,40,.12);
  }

  /* Placeholder if no image URL has been added */
  .placeholder {
    position: absolute;
    inset: 10%;
    display: grid;
    place-items: center;
    padding: 20px;
    border: 1px dashed rgba(91,74,69,.25);
    background: #f5ece3;
    font-size: 15px;
    font-style: italic;
    cursor: pointer;
  }

  .photo-button {
    margin-top: 8px;
    padding: 7px 12px;
    border: 1px solid rgba(91,74,69,.22);
    border-radius: 20px;
    background: rgba(255,255,255,.55);
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 12px;
    cursor: pointer;
  }

  .photo-button:hover {
    background: rgba(255,255,255,.85);
  }

  .page-image-wrap {
    position: absolute;
    inset: 10%;
    display: grid;
    place-items: center;
  }

  .page-image-wrap .page-image {
    position: static;
    width: 100%;
    height: 100%;
  }

  .upload-input {
    display: none;
  }

  .page-number {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    opacity: .6;
  }

  /* ---------- CONTROLS ---------- */

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-top: 8px;
  }

  button {
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: Georgia, serif;
    cursor: pointer;
  }

  .arrow {
    font-size: 30px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    transition: background .2s, transform .2s;
  }

  .arrow:hover {
    background: rgba(141,111,101,.12);
    transform: scale(1.08);
  }

  .counter {
    min-width: 55px;
    font-size: 13px;
    opacity: .7;
  }

  .hint {
    margin-top: 12px;
    font-size: 12px;
    opacity: .55;
  }

  .back {
    display: none;
    margin-top: 8px;
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .back.visible { display: inline-block; }

  /* Small screens */
  @media (max-width: 500px) {
    .book-stage {
      height: 280px;
    }

    .page-image, .placeholder {
      inset: 12%;
      width: 76%;
      height: 76%;
    }
  }
</style>
</head>

<body>
<div class="widget">

  <div class="book-stage">

    <!-- COVER -->
    <div class="cover" id="cover" onclick="openBook()">
      <div class="cover-inner">
        <div class="cover-title">Book List</div>
        <div class="cover-decoration">♡</div>
        <div class="cover-subtitle">Read by name</div>
      </div>
    </div>

    <!-- OPEN BOOK -->
    <div class="open-book" id="openBook">

      <div class="page left" id="leftPage"></div>

      <div class="spine"></div>

      <div class="page right" id="rightPage"></div>

    </div>
  </div>

  <div class="controls">
    <button class="arrow" onclick="previousSpread()" aria-label="Previous pages">‹</button>
    <span class="counter" id="counter">1 / 4</span>
    <button class="arrow" onclick="nextSpread()" aria-label="Next pages">›</button>
  </div>

  <button class="back" id="backButton" onclick="closeBook()">close book</button>

  <div class="hint">Click the book to open it</div>
</div>

<script>
/*
  ============================================================
  CHANGE YOUR PAGE IMAGES HERE
  ============================================================

  Each pair becomes one open-book spread.

  These can be left empty.
  The widget now lets you choose photos directly from your device.

  You can still put image URLs here as default images if you want.
  Photos chosen with the upload buttons are saved in the browser.

  You can have as many spreads as you like.
*/

const spreads = [
  { left: "", right: "" }, // Page 1
  { left: "", right: "" }, // Page 2
  { left: "", right: "" }, // Page 3
  { left: "", right: "" }, // Page 4
  { left: "", right: "" }  // Page 5
];

let currentSpread = 0;

const cover = document.getElementById("cover");
const openBookEl = document.getElementById("openBook");
const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");
const counter = document.getElementById("counter");
const backButton = document.getElementById("backButton");

function storageKey(spreadIndex, side) {
  return `bookWidget_${spreadIndex}_${side}`;
}

function getSavedImage(spreadIndex, side) {
  return localStorage.getItem(storageKey(spreadIndex, side)) || "";
}

function makePage(container, imageUrl, text, spreadIndex, side) {
  container.innerHTML = "";

  const savedImage = getSavedImage(spreadIndex, side);
  const finalImage = savedImage || imageUrl;

  if (finalImage) {
    const wrap = document.createElement("div");
    wrap.className = "page-image-wrap";

    const img = document.createElement("img");
    img.className = "page-image";
    img.src = finalImage;
    img.alt = text;

    const button = document.createElement("button");
    button.className = "photo-button";
    button.textContent = "change photo";
    button.onclick = () => openPhotoPicker(spreadIndex, side);

    wrap.appendChild(img);
    wrap.appendChild(button);
    container.appendChild(wrap);
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";

    const content = document.createElement("div");
    content.innerHTML = "Add a photo";

    const button = document.createElement("button");
    button.className = "photo-button";
    button.textContent = "choose from device";
    button.onclick = () => openPhotoPicker(spreadIndex, side);

    content.appendChild(document.createElement("br"));
    content.appendChild(button);
    placeholder.appendChild(content);
    container.appendChild(placeholder);
  }
}

function openPhotoPicker(spreadIndex, side) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.className = "upload-input";

  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
      try {
        localStorage.setItem(
          storageKey(spreadIndex, side),
          reader.result
        );
        showSpread();
      } catch (error) {
        alert("This image is too large to save in the widget. Try a smaller photo.");
      }
    };

    reader.readAsDataURL(file);
  };

  input.click();
}

function showSpread() {
  const spread = spreads[currentSpread];

  makePage(leftPage, spread.left, "Book image", currentSpread, "left");
  makePage(rightPage, spread.right, "Book image", currentSpread, "right");

  counter.textContent =
    `${currentSpread + 1} / ${spreads.length}`;
}

function openBook() {
  cover.classList.add("open");

  setTimeout(() => {
    openBookEl.classList.add("visible");
    backButton.classList.add("visible");
  }, 350);

  showSpread();
}

function closeBook() {
  openBookEl.classList.remove("visible");
  backButton.classList.remove("visible");

  setTimeout(() => {
    cover.classList.remove("open");
  }, 350);
}

function nextSpread() {
  if (currentSpread < spreads.length - 1) {
    currentSpread++;
    showSpread();
  } else {
    // At the end of page 5: close the book and return to the cover.
    currentSpread = 0;
    closeBook();
  }
}

function previousSpread() {
  if (currentSpread > 0) {
    currentSpread--;
    showSpread();
  }
}

showSpread();
</script>

</body>
</html>
