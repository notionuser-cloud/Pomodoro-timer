<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    font-family: "Trebuchet MS", Arial, sans-serif;
}


/* CARD */

.card {
    width: 300px;
    height: 245px;
    padding: 13px;

    background: #fff4f7;
    border: 2px solid #f3d0da;
    border-radius: 24px;

    box-shadow: 5px 6px 0 #edc3cf;

    text-align: center;
}


/* TITLE */

.heading {
    font-size: 10px;
    letter-spacing: 2px;
    color: #b17b8c;
    margin-bottom: 6px;
    font-weight: 600;
}


/* TIMER */

.timer {
    height: 67px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fffdfd;
    border: 2px solid #f1d2db;
    border-radius: 17px;

    font-family: "Courier New", monospace;
    font-size: 43px;
    font-weight: bold;

    color: #795564;

    box-shadow: inset 0 2px 5px rgba(170,120,135,.06);
}


/* STATUS */

.status {
    display: inline-block;

    margin: 5px 0;

    padding: 4px 13px;

    background: #f9d6e0;
    border-radius: 20px;

    color: #805566;

    font-size: 9px;
    font-weight: bold;
}


/* MAIN BUTTONS */

.buttons {
    display: flex;
    justify-content: center;
    gap: 8px;

    margin-bottom: 7px;
}

button {
    border: 2px solid #e9b8c7;

    background: #f8ceda;
    color: #795261;

    cursor: pointer;

    font-family: Arial, sans-serif;
    font-weight: normal;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
}

button:hover {
    transform: translateY(-1px);
    background: #f4c0cf;
    box-shadow: 0 2px 4px rgba(170, 110, 130, 0.12);
}

button:active {
    transform: translateY(1px);
}


/* PLAY / RESET */

.main-btn {
    width: 39px;
    height: 29px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 15px;
}


/* PLAY ICON */

.play-icon {
    width: 0;
    height: 0;

    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 8px solid #795261;

    margin-left: 2px;
}


/* PAUSE ICON */

.pause-icon {
    display: flex;
    gap: 3px;
}

.pause-icon span {
    display: block;

    width: 3px;
    height: 11px;

    background: #795261;
    border-radius: 2px;
}


/* RESET / REPLAY ICON */

.reset-icon {
    font-size: 19px;
    line-height: 1;

    transform: rotate(90deg);
}

.main-btn:hover .reset-icon {
    transform: rotate(105deg);
}


/* SETTINGS */

.settings {
    display: flex;
    gap: 7px;
}

.box {
    flex: 1;

    height: 61px;

    padding: 6px;

    background: #fffafb;

    border: 2px solid #f1ccd7;
    border-radius: 13px;
}

.label {
    font-size: 8px;
    letter-spacing: .5px;
    color: #ad7889;
    font-weight: bold;
}

.value {
    margin: 2px 0;

    font-family: "Courier New", monospace;
    font-size: 17px;
    font-weight: bold;

    color: #795261;
}


/* PLUS / MINUS */

.arrows {
    display: flex;
    justify-content: center;
    gap: 4px;

    transform: translateY(-2px);
}

.small-btn {
    width: 23px;
    height: 17px;

    border-radius: 8px;

    font-size: 11px;
}


/* FOOTER */

.footer {
    margin-top: 5px;

    font-size: 7px;
    letter-spacing: .5px;

    color: #c18d9c;
}

</style>
</head>


<body>

<div class="card">

    <div class="heading">
        ♡ POMODORO ♡
    </div>


    <div id="timer" class="timer">
        50:00
    </div>


    <div id="status" class="status">
        FOCUS TIME
    </div>


    <div class="buttons">

        <!-- PLAY / PAUSE -->

        <button
            id="start"
            class="main-btn"
            onclick="toggleTimer()"
            aria-label="Start timer">

            <span id="playIcon" class="play-icon"></span>

        </button>


        <!-- REPLAY / RESET -->

        <button
            class="main-btn"
            onclick="resetTimer()"
            aria-label="Reset timer">

            <span class="reset-icon">↻</span>

        </button>

    </div>


    <div class="settings">

        <!-- BREAK -->

        <div class="box">

            <div class="label">
                BREAK
            </div>

            <div id="breakValue" class="value">
                10
            </div>

            <div class="arrows">

                <button
                    class="small-btn"
                    onclick="changeBreak(1)">
                    +
                </button>

                <button
                    class="small-btn"
                    onclick="changeBreak(-1)">
                    −
                </button>

            </div>

        </div>


        <!-- FOCUS -->

        <div class="box">

            <div class="label">
                FOCUS
            </div>

            <div id="focusValue" class="value">
                50
            </div>

            <div class="arrows">

                <button
                    class="small-btn"
                    onclick="changeFocus(1)">
                    +
                </button>

                <button
                    class="small-btn"
                    onclick="changeFocus(-1)">
                    −
                </button>

            </div>

        </div>

    </div>


    <div class="footer">
        don't be an idiot ♡
    </div>

</div>


<script>

let focusLength = 50;
let breakLength = 10;

let secondsLeft = focusLength * 60;

let running = false;
let breakMode = false;

let interval;


/* UPDATE DISPLAY */

function update() {

    const minutes =
        Math.floor(secondsLeft / 60);

    const seconds =
        secondsLeft % 60;

    document.getElementById("timer")
        .textContent =
        String(minutes).padStart(2, "0")
        + ":" +
        String(seconds).padStart(2, "0");


    document.getElementById("status")
        .textContent =
        breakMode
        ? "BREAK TIME"
        : "FOCUS TIME";
}


/* PLAY / PAUSE ICON */

function updatePlayIcon() {

    const button =
        document.getElementById("playIcon");


    if (running) {

        button.className = "pause-icon";

        button.innerHTML =
            "<span></span><span></span>";

    } else {

        button.className = "play-icon";

        button.innerHTML = "";
    }
}


/* START / PAUSE */

function toggleTimer() {

    if (running) {

        clearInterval(interval);

        running = false;

        updatePlayIcon();

        return;
    }


    running = true;

    updatePlayIcon();


    interval = setInterval(() => {

        secondsLeft--;


        if (secondsLeft <= 0) {

            switchMode();

        }


        update();

    }, 1000);
}


/* SWITCH FOCUS / BREAK */

function switchMode() {

    breakMode = !breakMode;


    secondsLeft =
        (breakMode
            ? breakLength
            : focusLength) * 60;
}


/* RESET */

function resetTimer() {

    clearInterval(interval);

    running = false;

    breakMode = false;

    secondsLeft = focusLength * 60;

    updatePlayIcon();

    update();
}


/* CHANGE FOCUS */

function changeFocus(amount) {

    if (running) return;


    focusLength += amount;


    focusLength =
        Math.max(5, Math.min(120, focusLength));


    document.getElementById("focusValue")
        .textContent = focusLength;


    secondsLeft = focusLength * 60;

    update();
}


/* CHANGE BREAK */

function changeBreak(amount) {

    if (running) return;


    breakLength += amount;


    breakLength =
        Math.max(1, Math.min(60, breakLength));


    document.getElementById("breakValue")
        .textContent = breakLength;
}


/* INITIALISE */

update();

updatePlayIcon();

</script>

</body>
</html>
